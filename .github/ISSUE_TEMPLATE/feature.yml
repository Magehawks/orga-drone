name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        orga-drone is local-first. Approved issues move through implementation → focused tests → PR to develop → independent ChatGPT review → corrections if needed → authorized merge. PM/UX/engineering advice is optional for unresolved questions. Periodic Product Owner testing is separate; release approval remains human-controlled.

        A pain point without a proposed change belongs on the **User need** form. External research is evidence, not a request from the person you observed. Filing either form does not add a public roadmap item; that requires a separate maintainer decision (`docs/USER_NEEDS.md`).
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What concrete problem is the user trying to solve? Why is the current behavior insufficient?
      placeholder: e.g. I have selected several drone clips for a memory and want …
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: Target user
      description: Who has this problem (hobby pilot, creator, professional operator, etc.)?
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Journey / why now
      description: Where does this improve Adventure → Capture → Import → Organize → Rediscover → Create → Share → Relive, and why does it belong in the current slice?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful user-facing solution. Avoid implementation detail unless it is a hard constraint.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that must be true before the feature is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: Explicit non-scope
      description: What tempting related work must NOT be implemented in this issue?
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: ux
    attributes:
      label: UX discovery
      description: If interaction choices remain unresolved, link optional UX advice and the approved direction. Not a mandatory handoff for settled scope.
    validations:
      required: false
  - type: textarea
    id: technical
    attributes:
      label: Technical constraints
      description: Record known constraints; optional engineering advice can resolve questions. Note compatibility, non-destructive behavior, architecture, performance, migration and test constraints.
    validations:
      required: false
  - type: textarea
    id: testing
    attributes:
      label: Risk and testing expectations
      description: Describe focused regression/integration evidence by risk and useful periodic DJI/edit/export scenarios. Identify any issue-specific manual evidence requirement.
    validations:
      required: false
  - type: checkboxes
    id: readiness
    attributes:
      label: Implementation readiness
      options:
        - label: Product Owner approved the scope and acceptance criteria (link decision above)
        - label: Non-scope and relevant safety/compatibility constraints are recorded
