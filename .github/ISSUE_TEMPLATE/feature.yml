name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        orga-drone is local-first. Feature ideas move through PM → CTO → Development → Independent Review → Human Test before merge.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What concrete problem is the user trying to solve? Why is the current behavior insufficient?
      placeholder: e.g. I have selected several drone clips for a memory and want …
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: Target user
      description: Who has this problem (hobby pilot, creator, professional operator, etc.)?
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Journey / why now
      description: Where does this improve Adventure → Capture → Import → Organize → Rediscover → Create → Share → Relive, and why does it belong in the current slice?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful user-facing solution. Avoid implementation detail unless it is a hard constraint.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that must be true before the feature is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: Explicit non-scope
      description: What tempting related work must NOT be implemented in this issue?
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: CTO / technical constraints
      description: Filled or refined during CTO review. Note compatibility, non-destructive behavior, architecture, performance, migration and test constraints.
    validations:
      required: false
  - type: textarea
    id: testing
    attributes:
      label: Human test scenario
      description: What should the Product Owner test with realistic drone media before merge?
    validations:
      required: false
  - type: checkboxes
    id: gates
    attributes:
      label: Agent gates
      options:
        - label: PM product gate completed (`PM_APPROVED`)
        - label: CTO engineering gate completed (`CTO_APPROVED`)
        - label: Ready for developer agent
