name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please avoid pasting private flight paths, home coordinates, or full file paths from your machine.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: orga-drone version
      description: Release tag, exe build, or `main` commit if from source
      placeholder: e.g. 1.5.0 or main @ abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add library folder …
        2. Open detail page …
        3. See error …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Terminal output or screenshot. Redact personal paths if needed.
      render: shell
