# Manual Windows onefolder build.
# Builds a zip as a non-publishing Actions artifact (30 days). It never creates or
# updates a GitHub Release, never uploads to itch.io, and never posts to
# Discord. Push, pull-request, merge, and tag events do not start it.
# Only a maintainer can start it with workflow_dispatch.
# See packaging/README.md and docs/RELEASE_SECURITY.md.

name: Manual Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Version matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            python3 packaging/verify_release_version.py --tag "${RELEASE_TAG}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 packaging/verify_release_version.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "commit=${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

  quality:
    name: Ruff, MyPy and unit tests
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    name: PyInstaller onefolder zip
    needs: [verify-version, quality]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Log version and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionLine = python packaging/verify_release_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versionLine | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "commit=${{ github.sha }}" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Install project and PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller==6.22.3"

      - name: Build onefolder app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller packaging/orga-drone.spec --noconfirm --clean --distpath dist
          $built = "packaging\third_party\ffmpeg-gpl\bin\ffmpeg.exe"
          if (Test-Path $built) {
            $targets = Get-ChildItem -Path "dist\orga-drone" -Recurse -File -Filter "ffmpeg*.exe"
            if (-not $targets) { throw "PyInstaller collected no ffmpeg.exe to replace" }
            foreach ($target in $targets) {
              Copy-Item $built $target.FullName -Force
            }
          }

      - name: Check bundle layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path (Get-Location) "dist\orga-drone"
          if (-not (Test-Path (Join-Path $root "orga-drone.exe"))) {
            throw "dist/orga-drone/orga-drone.exe is missing"
          }
          foreach ($rel in @(
            "_internal",
            "_internal\orga_drone\templates",
            "_internal\orga_drone\static",
            "_internal\orga_drone\locales"
          )) {
            if (-not (Test-Path (Join-Path $root $rel))) {
              throw "Missing bundled path: $rel"
            }
          }
          $ffmpeg = Get-ChildItem -Path $root -Recurse -File -Filter "ffmpeg*.exe" |
            Select-Object -First 1
          if (-not $ffmpeg) { throw "Bundled ffmpeg executable is missing" }
          $webview = Get-ChildItem -Path $root -Recurse -File -Filter "Microsoft.Web.WebView2.Core.dll" |
            Select-Object -First 1
          if (-not $webview) { throw "WebView2 Core assembly is missing" }
          $runtime = Get-ChildItem -Path $root -Recurse -File -Filter "Python.Runtime.dll" |
            Select-Object -First 1
          if (-not $runtime) { throw "Python.Runtime.dll is missing" }
          $banned = Get-ChildItem -Path $root -Recurse -File | Where-Object {
            $_.Extension -in ".sqlite", ".sqlite3", ".db" -or
              $_.Name -eq ".env" -or
              $_.Extension -in ".mp4", ".mov", ".lrv", ".insv", ".dng"
          }
          if ($banned) {
            throw ("Bundle must not contain a database, .env, or source media: " +
              ($banned.FullName -join ", "))
          }

      - name: Write third-party notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python packaging/windows_third_party.py write dist/orga-drone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "orga-drone-windows-x64.zip") {
            Remove-Item "orga-drone-windows-x64.zip" -Force
          }
          tar.exe -a -c -f orga-drone-windows-x64.zip -C dist orga-drone
          $names = @(tar.exe -tf orga-drone-windows-x64.zip)
          $normalized = $names | ForEach-Object { $_.Replace("\", "/").TrimStart("./") }
          if ($normalized -notcontains "orga-drone/orga-drone.exe") {
            throw "Zip is missing orga-drone/orga-drone.exe"
          }
          if (-not ($normalized | Where-Object { $_.StartsWith("orga-drone/_internal/") })) {
            throw "Zip is missing orga-drone/_internal/"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -Path "orga-drone-windows-x64.zip").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "orga-drone-windows-x64.zip.sha256"),
            "$hash  orga-drone-windows-x64.zip`n"
          )
          $versionLine = python packaging/verify_release_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseText = @(
            $versionLine.Trim(),
            "commit=${{ github.sha }}",
            "sha256=$hash"
          ) -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "release-build.txt"),
            $releaseText + "`n"
          )
          $versionLine | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "commit=${{ github.sha }}" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "sha256=$hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          python packaging/windows_third_party.py verify-zip orga-drone-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orga-drone-windows-x64
          path: |
            orga-drone-windows-x64.zip
            orga-drone-windows-x64.zip.sha256
            release-build.txt
          if-no-files-found: error
          retention-days: 30
