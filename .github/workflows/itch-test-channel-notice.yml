# Notifies Discord after a maintainer publishes a GitHub Release.
# Butler is still a manual step. This workflow does not upload to itch.io
# and does not describe the page as a public launch.
# The webhook is secrets.DISCORD_RELEASE_WEBHOOK. An empty secret skips
# the post. A Discord error does not fail the release.

name: itch.io test channel notice

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  discord-notice:
    name: Discord test-channel notice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Discord webhook secret
        id: discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -n "${DISCORD_RELEASE_WEBHOOK:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DISCORD_RELEASE_WEBHOOK is empty; skipping Discord."
          fi

      - name: Checkout release tag
        if: steps.discord.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Post itch.io test-channel notice
        if: steps.discord.outputs.enabled == 'true'
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_RELEASE_WEBHOOK:-}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is empty; skipping Discord."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          DEFAULT_PARAGRAPH = (
              "A local-first drone media library with flight metadata, telemetry, "
              "map exploration, and a Studio memory-editor UI."
          )
          README_MAIN = "https://github.com/Magehawks/orga-drone/blob/main/README.md"
          AVAILABILITY = "This version is available on the itch.io test channel."


          def version_from_tag(tag: str) -> str:
              if len(tag) > 1 and tag.startswith("v") and tag[1].isdigit():
                  return tag[1:]
              return tag


          def version_from_pyproject(path: Path) -> str:
              if not path.is_file():
                  return ""
              match = re.search(
                  r'(?m)^version\s*=\s*"([^"]+)"',
                  path.read_text(encoding="utf-8"),
              )
              return match.group(1).strip() if match else ""


          def opening_paragraph(path: Path) -> str:
              if not path.is_file():
                  return DEFAULT_PARAGRAPH
              buf: list[str] = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      if buf:
                          break
                      continue
                  if stripped.startswith("![") or stripped.startswith("|"):
                      continue
                  buf.append(stripped)
              if not buf:
                  return DEFAULT_PARAGRAPH
              text = " ".join(buf).replace("**", "").replace("`", "")
              text = " ".join(text.split())
              if len(text) > 500:
                  text = text[:497].rstrip() + "..."
              return text or DEFAULT_PARAGRAPH


          def readme_url(tag: str) -> str:
              if not tag:
                  return README_MAIN
              return f"https://github.com/Magehawks/orga-drone/blob/{tag}/README.md"


          def build_content(version: str, paragraph: str, link: str) -> str:
              content = "\n".join(
                  [
                      f"Orga Drone {version}",
                      AVAILABILITY,
                      paragraph,
                      link,
                  ]
              )
              if len(content) <= 2000:
                  return content
              shorter = "\n".join([f"Orga Drone {version}", AVAILABILITY, link])
              if len(shorter) <= 2000:
                  return shorter
              return shorter[:1997] + "..."


          def send() -> int:
              webhook = os.environ.get("DISCORD_RELEASE_WEBHOOK", "")
              if not webhook:
                  print("DISCORD_RELEASE_WEBHOOK is empty; skipping Discord.")
                  return 0
              tag = os.environ.get("RELEASE_TAG", "").strip()
              version = (
                  version_from_tag(tag)
                  or version_from_pyproject(Path("pyproject.toml"))
                  or "unknown"
              )
              content = build_content(
                  version,
                  opening_paragraph(Path("README.md")),
                  readme_url(tag),
              )
              body = json.dumps({"content": content}).encode("utf-8")
              request = urllib.request.Request(
                  webhook,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "orga-drone-release-notice",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"Discord status {response.status}")
              except urllib.error.HTTPError as exc:
                  print(f"Discord notification failed with HTTP {exc.code}")
              except urllib.error.URLError:
                  print("Discord notification failed: network error")
              except Exception:
                  print("Discord notification failed")
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(send())
              except SystemExit:
                  raise
              except Exception:
                  print("Discord notification failed")
                  raise SystemExit(0)
          PY

