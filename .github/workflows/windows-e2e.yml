# Packaged Windows E2E for develop/hotfix promotions to main (issue #262).
# Builds the existing onefolder app once, tests the extracted ZIP against the
# real WebView2 runtime, and uploads bounded Actions artifacts. It never
# publishes, tags, attaches a GitHub Release, or uses release credentials.

name: Windows packaged E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-packaged-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packaged-e2e:
    name: Windows packaged E2E
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record candidate and tested tree
        id: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $head = "${{ github.event.pull_request.head.sha }}"
          $base = "${{ github.event.pull_request.base.sha }}"
          $tested = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse "HEAD^{tree}").Trim()
          # The event payload's merge_commit_sha can lag the merge ref that was
          # actually checked out. Bind evidence to the tested commit and let the
          # live admission policy compare it to the current PR merge SHA.
          if (-not $tested) { throw "Checked-out commit SHA is unavailable" }
          $merge = $tested
          "head_sha=$head" >> $env:GITHUB_OUTPUT
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          "merge_sha=$merge" >> $env:GITHUB_OUTPUT
          "tree_sha=$tree" >> $env:GITHUB_OUTPUT
          "tested=$tested" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "tree=$tree" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install project and E2E tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller==6.22.3" "websocket-client==1.8.0"

      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $pv = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $pv -or $pv -eq "0.0.0.0") {
            $installer = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest -UseBasicParsing -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
            $sig = Get-AuthenticodeSignature -FilePath $installer
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Microsoft") {
              throw "WebView2 bootstrapper signature is not a valid Microsoft signature"
            }
            Start-Process -FilePath $installer -ArgumentList "/silent", "/install" -Wait
            $pv = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          }
          if (-not $pv -or $pv -eq "0.0.0.0") { throw "WebView2 Runtime is not installed" }
          "webview2_version=$pv" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Build onefolder app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller packaging/orga-drone.spec --noconfirm --clean --distpath dist
          $built = "packaging\third_party\ffmpeg-gpl\bin\ffmpeg.exe"
          if (Test-Path $built) {
            $targets = Get-ChildItem -Path "dist\orga-drone" -Recurse -File -Filter "ffmpeg*.exe"
            if (-not $targets) { throw "PyInstaller collected no ffmpeg.exe to replace" }
            foreach ($target in $targets) { Copy-Item $built $target.FullName -Force }
          }

      - name: Zip and checksum candidate
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "orga-drone-windows-x64.zip") {
            Remove-Item "orga-drone-windows-x64.zip" -Force
          }
          tar.exe -a -c -f orga-drone-windows-x64.zip -C dist orga-drone
          $hash = (Get-FileHash -Algorithm SHA256 -Path "orga-drone-windows-x64.zip").Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "zip_sha256=$hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Expand-Archive -Path "orga-drone-windows-x64.zip" -DestinationPath "$env:RUNNER_TEMP\orga-e2e-extract" -Force

      - name: Run packaged WebView2 E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ffmpeg = (python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
          if (-not $ffmpeg -or -not (Test-Path $ffmpeg)) { throw "FFmpeg is unavailable for synthetic media" }
          python packaging/e2e/windows_e2e.py `
            --exe "$env:RUNNER_TEMP\orga-e2e-extract\orga-drone\orga-drone.exe" `
            --zip "orga-drone-windows-x64.zip" `
            --zip-sha256 "${{ steps.package.outputs.sha256 }}" `
            --artifact-name "orga-drone-windows-e2e-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}" `
            --output-dir "$env:RUNNER_TEMP\orga-e2e" `
            --ffmpeg "$ffmpeg" `
            --repository "${{ github.repository }}" `
            --pr-number "${{ github.event.pull_request.number }}" `
            --head-sha "${{ github.event.pull_request.head.sha }}" `
            --base-sha "${{ github.event.pull_request.base.sha }}" `
            --merge-sha "${{ steps.candidate.outputs.merge_sha }}" `
            --tree-sha "${{ steps.candidate.outputs.tree_sha }}" `
            --run-id "${{ github.run_id }}" `
            --run-attempt "${{ github.run_attempt }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload packaged candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orga-drone-windows-e2e-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: orga-drone-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-e2e-evidence-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/orga-e2e/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-e2e-diagnostics-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/orga-e2e/*.png
            ${{ runner.temp }}/orga-e2e/data/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize E2E result
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "orga-e2e\evidence.json"
          if (Test-Path $evidence) {
            $data = Get-Content $evidence -Raw | ConvertFrom-Json
            "evidence_result=$($data.result)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "artifact_sha256=$($data.artifact_sha256)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            "evidence_result=missing" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
