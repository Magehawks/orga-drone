[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orga-drone"
version = "1.7.1"
description = "Local open-source drone video library manager (DJI Avata 2 first)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "orga-drone contributors" }]
keywords = ["drone", "dji", "video", "library", "openstreetmap"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "pillow>=10.4.0",
  "pillow-heif>=0.18.0",
  "python-dotenv>=1.0.1",
  "imageio-ffmpeg>=0.5.1",
  "pywebview>=5.0",
  "reverse-geocoder>=1.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx2>=2.0",
]

[project.scripts]
orga-drone = "orga_drone.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orga_drone = [
  "templates/**/*",
  "static/**/*",
  "locales/**/*",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
extend-exclude = ["releases", "dist", "build"]

[tool.ruff.lint]
# Classic pyflakes + critical pycodestyle baseline (pre-Ruff-0.16 defaults).
# Broader rule adoption belongs in a dedicated cleanup PR, not in CI bootstrap.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "reverse_geocoder",
  "imageio_ffmpeg",
  "pillow_heif",
]
ignore_missing_imports = true
